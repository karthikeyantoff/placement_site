{% extends "base.html" %}

{% block title %}PMS Manager - Student Directory{% endblock %}
{% block header_title %}Student Directory Operations{% endblock %}

{% block content %}
<!-- Use same visual interface as admin but restricted to Manager dashboard -->
<div id="students-container-injected"></div>
{% endblock %}

{% block scripts %}
<script>
    // Dynamically inject the exact same high-fidelity UI to reuse code, but checking security on endpoints.
    // Managers have full student editing capabilities.
    async function loadStudentsUI() {
        try {
            const adminRes = await fetch('/static/html_components/students_ui.html');
            if (adminRes.ok) {
                const html = await adminRes.text();
                document.getElementById('students-container-injected').innerHTML = html;
                
                // Fetch the scripts logic dynamically or load students
                loadStudents();
            } else {
                // Fallback direct load if static component not compiled yet:
                // Let's fetch admin's HTML content from route endpoint and insert it.
                // This keeps manager UI synchronized perfectly.
                window.location.hash = "loading";
            }
        } catch (e) {}
    }
</script>

<!-- Directly copy the student HTML setup dynamically for identical, clean view -->
<script>
    // Copy table structure, search triggers, and modal setups
    const container = document.getElementById('students-container-injected');
    container.innerHTML = `
        <div class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <h3 class="text-lg font-extrabold text-slate-900 uppercase tracking-wider">Candidate Registry</h3>
                    <p class="text-xs text-slate-500 font-medium">Search profiles, edit academic details, and register placements.</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <div class="relative w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </span>
                        <input type="text" id="student-search-input" onkeyup="filterStudents()" placeholder="Search Reg No or Name..." class="w-full bg-slate-50 border border-slate-300 rounded-xl py-2 pl-9 pr-4 text-xs placeholder-slate-400 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                    </div>
                    <button onclick="openAddStudentModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-md shadow-indigo-600/20 transition active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Student

            </div>
            <div class="glass-panel rounded-2xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider">
                                <th class="p-4">Reg Number</th>
                                <th class="p-4">Student</th>
                                <th class="p-4">Department</th>
                                <th class="p-4">Contact Info</th>
                                <th class="p-4">Graduation</th>
                                <th class="p-4">Placement Status</th>
                                <th class="p-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="student-table-body" class="divide-y divide-slate-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Add / Edit Modal -->
        <div id="student-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 z-50 overflow-y-auto">
            <div class="bg-white border border-slate-200 rounded-3xl max-w-3xl w-full max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
                <div class="p-5 sm:p-6 border-b border-slate-200 flex items-center justify-between">
                    <h4 id="modal-title" class="text-sm sm:text-base font-extrabold uppercase tracking-wider text-slate-900">Register New Student</h4>
                    <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-700 bg-slate-100 p-2 rounded-full border border-slate-200 transition" aria-label="Close modal">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <form id="student-form" onsubmit="handleFormSubmit(event)" class="overflow-y-auto p-5 sm:p-6 space-y-6 text-xs flex-1">
                    <input type="hidden" id="form-student-id">
                    <div>
                        <h5 class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600 mb-4 border-b border-slate-200 pb-1">Personal Details</h5>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Full Name *</label>
                                <input type="text" id="form-name" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">

                                <select id="form-department" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                                    <option value="CSE">Computer Science (CSE)</option>
                                    <option value="IT">Information Technology (IT)</option>
                                    <option value="AI&DS">Artificial Intelligence (AI&DS)</option>
                                    <option value="ECE">Electronics & Communication (ECE)</option>
                                    <option value="EEE">Electrical & Electronics (EEE)</option>

                                <select id="form-gender" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">

                                </select>

                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Student Type *</label>
                                <select id="form-student-type" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                                    <option value="Day Scholar">Day Scholar</option>
                                    <option value="Hosteller">Hosteller</option>
                                </select>
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Year of Graduation *</label>
                                <input type="number" id="form-year" required value="2025" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>
                    </div>
                    <div>
                        <h5 class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600 mb-4 border-b border-slate-200 pb-1">Contact Info</h5>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Phone Number *</label>
                                <input type="text" id="form-phone" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Email Address *</label>
                                <input type="email" id="form-email" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>
                    </div>
                    <div>
                        <h5 class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600 mb-4 border-b border-slate-200 pb-1">Academic Percentages (%)</h5>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">SSLC % *</label>
                                <input type="number" step="0.01" id="form-sslc" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">HSC % *</label>
                                <input type="number" step="0.01" id="form-hsc" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">UG CGPA/ % *</label>
                                <input type="number" step="0.01" id="form-ug" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">PG % (Optional)</label>
                                <input type="number" step="0.01" id="form-pg" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>
                    </div>
                    <div>
                        <h5 class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600 mb-4 border-b border-slate-200 pb-1">Professional Portfolio & Media Links</h5>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">GitHub Link</label>
                                <input type="url" id="form-github" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">LinkedIn Profile Link</label>
                                <input type="url" id="form-linkedin" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Portfolio Website Link</label>
                                <input type="url" id="form-portfolio" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Self Introduction Link / Video</label>
                                <input type="url" id="form-self-intro-link" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Upload Profile Photo</label>
                                <input type="file" id="form-photo-file" accept="image/*" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-slate-600 focus:outline-none focus:border-indigo-600 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                            </div>
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Upload Resume (PDF)</label>
                                <input type="file" id="form-resume-file" accept=".pdf" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-slate-600 focus:outline-none focus:border-indigo-600 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                            </div>
                        </div>
                    </div>
                    <div>
                        <h5 class="text-[10px] font-extrabold uppercase tracking-widest text-indigo-600 mb-4 border-b border-slate-200 pb-1">Placement Status</h5>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="space-y-1.5">
                                <label class="font-bold text-slate-700">Status *</label>
                                <select id="form-placement-status" onchange="togglePlacementFields()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 focus:outline-none focus:border-indigo-600 focus:bg-white">
                                    <option value="YTPP">YTPP (Yet To Be Placed)</option>
                                    <option value="PLACED">Placed</option>
                                    <option value="UNENROLLED">Unenrolled</option>
                                </select>
                            </div>
                            <div id="placement-company-field" class="hidden space-y-1.5">
                                <label class="font-bold text-slate-700">Placed Company Name *</label>
                                <input type="text" id="form-placed-company" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                            <div id="placement-ctc-field" class="hidden space-y-1.5">
                                <label class="font-bold text-slate-700">Package (CTC in LPA) *</label>
                                <input type="number" step="0.1" id="form-ctc-lpa" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:bg-white">
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 border-t border-slate-200 pt-5">
                        <button type="button" onclick="closeStudentModal()" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 font-bold px-4 py-2.5 rounded-xl transition">Cancel</button>
                        <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20 active:scale-95">Save Student Details</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- View Modal -->
        <div id="view-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 z-50 overflow-y-auto">
            <div class="bg-white border border-slate-200 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto flex flex-col shadow-2xl relative">
                <button onclick="closeViewModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 z-10 bg-white/90 p-2 rounded-full border border-slate-200 shadow-sm transition" aria-label="Close modal">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <div id="view-profile-card"></div>
            </div>
        </div>
    `;
</script>
<script>
    let studentDataset = [];

    async function loadStudents() {
        try {
            const res = await fetch('/api/students');
            if (res.ok) {
                studentDataset = await res.json();
                renderStudentTable(studentDataset);
            } else {
                showToast("Could not load student registry.", "error");
            }
        } catch (e) {
            showToast("Server error during loading.", "error");
        }
    }

    function renderStudentTable(students) {
        const body = document.getElementById('student-table-body');
        if (students.length === 0) {
            body.innerHTML = `<tr><td colspan="7" class="text-center text-slate-500 py-8">No students found.</td></tr>`;
            return;
        }

        body.innerHTML = students.map(s => {
            let badgeColor = "bg-slate-100 text-slate-700 border-slate-200";
            if (s.placement_status === 'PLACED') badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
            if (s.placement_status === 'YTPP') badgeColor = "bg-amber-50 text-amber-700 border-amber-200";

            return `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-mono font-bold text-slate-700 select-all">${s.reg_number}</td>
                    <td class="p-4 font-semibold text-slate-900">
                        <div class="flex items-center gap-3">
                            <img src="${s.photo_url || '/static/images/avatar-placeholder.png'}" class="w-8 h-8 rounded-full border border-slate-200 object-cover shadow-xs" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400'">
                            <span>${s.name}</span>
                        </div>
                    </td>
                    <td class="p-4 text-slate-600 font-medium">${s.department}</td>
                    <td class="p-4 text-slate-600 font-medium">
                        <div>${s.email}</div>
                        <div class="text-[10px] text-slate-500">${s.phone}</div>
                    </td>
                    <td class="p-4 font-bold text-slate-700">${s.year_of_graduation}</td>
                    <td class="p-4">
                        <span class="inline-block px-2.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase border ${badgeColor}">
                            ${s.placement_status}
                        </span>
                    </td>
                    <td class="p-4 text-right space-x-1.5 whitespace-nowrap">
                        <button onclick="viewStudent('${s.reg_number}')" class="bg-indigo-50 hover:bg-indigo-600 text-indigo-700 hover:text-white px-2.5 py-1.5 rounded-lg font-bold border border-indigo-200 transition shadow-xs">View</button>
                        <button onclick="editStudent('${s.reg_number}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-bold border border-slate-300 transition shadow-xs">Edit</button>
                        <button onclick="deleteStudent('${s._id}', '${s.name}')" class="bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white px-2.5 py-1.5 rounded-lg font-bold border border-rose-200 transition shadow-xs">Delete</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filterStudents() {
        const val = document.getElementById('student-search-input').value.toLowerCase();
        const filtered = studentDataset.filter(s => 
            s.reg_number.toLowerCase().includes(val) || 
            s.name.toLowerCase().includes(val)
        );
        renderStudentTable(filtered);
    }

    function openAddStudentModal() {
        document.getElementById('modal-title').innerText = "Register New Student";
        document.getElementById('form-student-id').value = "";
        document.getElementById('student-form').reset();
        document.getElementById('form-reg-number').removeAttribute('readonly');
        togglePlacementFields();
        document.getElementById('student-modal').classList.remove('hidden');
    }

    function closeStudentModal() {
        document.getElementById('student-modal').classList.add('hidden');
    }

    function togglePlacementFields() {
        const status = document.getElementById('form-placement-status').value;
        const companyField = document.getElementById('placement-company-field');
        const ctcField = document.getElementById('placement-ctc-field');
        
        if (status === 'PLACED') {
            companyField.classList.remove('hidden');
            ctcField.classList.remove('hidden');
            document.getElementById('form-placed-company').setAttribute('required', 'true');
            document.getElementById('form-ctc-lpa').setAttribute('required', 'true');
        } else {
            companyField.classList.add('hidden');
            ctcField.classList.add('hidden');
            document.getElementById('form-placed-company').removeAttribute('required');
            document.getElementById('form-ctc-lpa').removeAttribute('required');
        }
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        const studentId = document.getElementById('form-student-id').value;
        const formData = new FormData();
        
        formData.append("name", document.getElementById('form-name').value);
        formData.append("reg_number", document.getElementById('form-reg-number').value);
        formData.append("department", document.getElementById('form-department').value);
        formData.append("gender", document.getElementById('form-gender').value);
        formData.append("student_type", document.getElementById('form-student-type').value);
        formData.append("year_of_graduation", document.getElementById('form-year').value);
        formData.append("phone", document.getElementById('form-phone').value);
        formData.append("email", document.getElementById('form-email').value);
        formData.append("sslc_percentage", document.getElementById('form-sslc').value);
        formData.append("hsc_percentage", document.getElementById('form-hsc').value);
        formData.append("ug_percentage", document.getElementById('form-ug').value);
        formData.append("pg_percentage", document.getElementById('form-pg').value);
        formData.append("github_link", document.getElementById('form-github').value);
        formData.append("linkedin_link", document.getElementById('form-linkedin').value);
        formData.append("portfolio_link", document.getElementById('form-portfolio').value);
        formData.append("self_intro_link", document.getElementById('form-self-intro-link').value);
        formData.append("placement_status", document.getElementById('form-placement-status').value);
        formData.append("placed_company", document.getElementById('form-placed-company').value);
        formData.append("ctc_lpa", document.getElementById('form-ctc-lpa').value);
        
        const photoFile = document.getElementById('form-photo-file').files[0];
        const resumeFile = document.getElementById('form-resume-file').files[0];
        if (photoFile) formData.append("photo", photoFile);
        if (resumeFile) formData.append("resume", resumeFile);
        
        let url = '/api/students';
        let method = 'POST';
        if (studentId) {
            url = `/api/students/${studentId}`;
            method = 'PUT';
        }
        
        try {
            const res = await fetch(url, { method: method, body: formData });
            const data = await res.json();
            if (res.ok) {
                showToast(studentId ? "Student updated." : "Student registered.", "success");
                closeStudentModal();
                loadStudents();
            } else {
                showToast(data.error || "Failed to save.", "error");
            }
        } catch (err) {
            showToast("Server error.", "error");
        }
    }

    async function viewStudent(regNumber) {
        try {
            const res = await fetch(`/api/students/${regNumber}`);
            if (res.ok) {
                const s = await res.json();
                const profileCard = document.getElementById('view-profile-card');
                profileCard.innerHTML = `
                    <div class="h-28 bg-gradient-to-r from-indigo-600 via-indigo-700 to-violet-700 relative"></div>
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="flex flex-col sm:flex-row items-center sm:items-end justify-between gap-4 -mt-16 sm:-mt-18">
                            <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-2xl border-4 border-white overflow-hidden bg-indigo-50 shadow-xl shrink-0">
                                <img src="${s.photo_url || '/static/images/avatar-placeholder.png'}" 
                                     class="w-full h-full object-cover"
                                     onerror="this.src='/static/images/avatar-placeholder.png'">
                            </div>
                            <div class="text-center sm:text-left flex-1 min-w-0">
                                <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 truncate">${s.name}</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Registration Number: <span class="font-mono text-indigo-600 font-bold">${s.reg_number}</span></p>
                            </div>
                            <span class="inline-block px-3.5 py-1.5 text-xs font-extrabold uppercase rounded-full border shadow-xs ${s.placement_status === 'PLACED' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
                                ${s.placement_status} ${s.placement_status === 'PLACED' ? `@ ${s.placed_company} (${s.ctc_lpa} LPA)` : ''}
                            </span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 text-xs">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                                <h5 class="font-extrabold uppercase tracking-widest text-[9px] text-indigo-600 mb-2">Academics</h5>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">Department</span><span class="font-bold text-slate-800">${s.department}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">Graduation Year</span><span class="font-bold text-slate-800">${s.year_of_graduation}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">SSLC (%)</span><span class="font-bold text-slate-800">${s.sslc_percentage}%</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">HSC (%)</span><span class="font-bold text-slate-800">${s.hsc_percentage}%</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">UG Score</span><span class="font-bold text-slate-800">${s.ug_percentage <= 10 ? s.ug_percentage + ' CGPA' : s.ug_percentage + '%'}</span></div>
                                <div class="flex justify-between py-1"><span class="text-slate-500 font-medium">PG Percentage</span><span class="font-bold text-slate-800">${s.pg_percentage ? s.pg_percentage + '%' : 'N/A'}</span></div>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                                <h5 class="font-extrabold uppercase tracking-widest text-[9px] text-indigo-600 mb-2">General & Contact</h5>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">Gender</span><span class="font-bold text-slate-800">${s.gender}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">Residence</span><span class="font-bold text-slate-800">${s.student_type}</span></div>
                                <div class="flex justify-between py-1 border-b border-slate-200/60"><span class="text-slate-500 font-medium">Mobile</span><span class="font-bold text-slate-800">${s.phone}</span></div>
                                <div class="flex justify-between py-1"><span class="text-slate-500 font-medium">Email</span><span class="font-bold text-slate-800 truncate max-w-[150px]">${s.email}</span></div>
                            </div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs">
                            <h5 class="font-extrabold uppercase tracking-widest text-[9px] text-indigo-600 mb-3">Credentials & Media Links</h5>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                                ${s.resume_url ? `<a href="${s.resume_url}" target="_blank" class="flex items-center justify-center gap-2 p-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-bold border border-indigo-200 transition text-center">Resume PDF</a>` : ''}
                                ${s.github_link ? `<a href="${s.github_link}" target="_blank" class="flex items-center justify-center gap-2 p-2.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl font-bold border border-slate-200 transition text-center shadow-xs">GitHub</a>` : ''}
                                ${s.linkedin_link ? `<a href="${s.linkedin_link}" target="_blank" class="flex items-center justify-center gap-2 p-2.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl font-bold border border-slate-200 transition text-center shadow-xs">LinkedIn</a>` : ''}
                                ${s.portfolio_link ? `<a href="${s.portfolio_link}" target="_blank" class="flex items-center justify-center gap-2 p-2.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl font-bold border border-slate-200 transition text-center shadow-xs">Portfolio</a>` : ''}
                                ${s.self_intro_link ? `<a href="${s.self_intro_link}" target="_blank" class="flex items-center justify-center gap-2 p-2.5 bg-white hover:bg-slate-100 text-slate-700 rounded-xl font-bold border border-slate-200 transition text-center shadow-xs">Intro Video</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('view-modal').classList.remove('hidden');
            }
        } catch (e) {}
    }

    function closeViewModal() {
        document.getElementById('view-modal').classList.add('hidden');
    }

    async function editStudent(regNumber) {
        try {
            const res = await fetch(`/api/students/${regNumber}`);
            if (res.ok) {
                const s = await res.json();
                document.getElementById('modal-title').innerText = `Edit Profile: ${s.name}`;
                document.getElementById('form-student-id').value = s._id;
                document.getElementById('form-name').value = s.name;
                document.getElementById('form-reg-number').value = s.reg_number;
                document.getElementById('form-reg-number').setAttribute('readonly', 'true');
                document.getElementById('form-department').value = s.department;
                document.getElementById('form-gender').value = s.gender;
                document.getElementById('form-student-type').value = s.student_type;
                document.getElementById('form-year').value = s.year_of_graduation;
                document.getElementById('form-phone').value = s.phone;
                document.getElementById('form-email').value = s.email;
                document.getElementById('form-sslc').value = s.sslc_percentage;
                document.getElementById('form-hsc').value = s.hsc_percentage;
                document.getElementById('form-ug').value = s.ug_percentage;
                document.getElementById('form-pg').value = s.pg_percentage || "";
                document.getElementById('form-github').value = s.github_link;
                document.getElementById('form-linkedin').value = s.linkedin_link;
                document.getElementById('form-portfolio').value = s.portfolio_link;
                document.getElementById('form-self-intro-link').value = s.self_intro_link;
                document.getElementById('form-placement-status').value = s.placement_status;
                document.getElementById('form-placed-company').value = s.placed_company || "";
                document.getElementById('form-ctc-lpa').value = s.ctc_lpa || "";
                togglePlacementFields();
                document.getElementById('student-modal').classList.remove('hidden');
            }
        } catch (e) {}
    }

    async function deleteStudent(id, name) {
        if (confirm(`Delete student "${name}"?`)) {
            try {
                const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast("Student deleted.", "success");
                    loadStudents();
                }
            } catch (err) {}
        }
    }

    loadStudents();
</script>
{% endblock %}
