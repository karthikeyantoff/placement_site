<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS - Security Gateway Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0) 50%),
                        radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.1) 0%, rgba(2, 6, 23, 0) 50%),
                        #020617;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .active-tab {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <!-- Logo and Intro -->
        <div class="text-center mb-8 space-y-2">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-xl shadow-indigo-500/30 text-white font-extrabold text-2xl tracking-widest mx-auto mb-3 border border-indigo-400/30">
                <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path></svg>
            </div>
            <span class="inline-block bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest">Official Campus Portal</span>
            <h1 class="text-xl font-extrabold tracking-tight text-white uppercase leading-snug">Rathinam Global Deemed to be University</h1>
            <p class="text-xs text-indigo-300 font-bold tracking-wider uppercase">Placement Site</p>
            <p class="text-[11px] text-slate-400 pt-1 font-medium">Gateway for Administrators, Managers, and Sourcing Leads</p>
        </div>

        <!-- Glassmorphism Form Wrapper -->
        <div class="glass-panel rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <!-- Glow Accent -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>

            <!-- Role Selector Tabs -->
            <div class="grid grid-cols-3 gap-2 bg-slate-900/60 p-1.5 rounded-2xl mb-8 border border-slate-800/40">
                <button onclick="setRole('admin')" id="tab-admin" class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-slate-200 active-tab transition-all duration-300">
                    Admin
                </button>
                <button onclick="setRole('manager')" id="tab-manager" class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-slate-200 transition-all duration-300">
                    Manager
                </button>
                <button onclick="setRole('lead')" id="tab-lead" class="py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-slate-200 transition-all duration-300">
                    Lead
                </button>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-start gap-3">
                <svg class="w-5 h-5 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <div class="text-xs text-red-400 font-medium leading-normal" id="error-message"></div>
            </div>

            <!-- Form -->
            <form onsubmit="handleLogin(event)" class="space-y-6">
                <!-- Username Input -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="username" required placeholder="Enter username" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition duration-300 shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
                    Access Dashboard
                </button>
            </form>
        </div>
        
        <!-- Subtle Footer -->
        <p class="text-center text-slate-500 text-[10px] uppercase font-bold tracking-widest mt-8">Secure Layer • 256-bit Encrypted</p>
    </div>

    <!-- JS Client Actions -->
    <script>
        let currentRole = 'admin';

        function setRole(role) {
            currentRole = role;
            
            // Toggle active classes on tabs
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('active-tab');
            });
            document.getElementById(`tab-${role}`).classList.add('active-tab');
            
            // Clear errors
            document.getElementById('error-banner').classList.add('hidden');
            
            // Dynamic placeholders based on selected role
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');
            if (role === 'admin') {
                uInput.placeholder = 'sivasubramaniyan';
                pInput.placeholder = 'sivu@12345';
            } else if (role === 'manager') {
                uInput.placeholder = 'jeyakannan';
                pInput.placeholder = 'jk@12345';
            } else if (role === 'lead') {
                uInput.placeholder = 'lead-1';
                pInput.placeholder = 'lead1@12345';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.strip ? document.getElementById('username').value.strip() : document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorBanner = document.getElementById('error-banner');
            const errorMessage = document.getElementById('error-message');
            
            errorBanner.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput,
                        role: currentRole
                    })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    // Redirect to dashboard page
                    window.location.href = data.redirect_url;
                } else {
                    errorMessage.innerText = data.error || 'Authentication failed. Please try again.';
                    errorBanner.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMessage.innerText = 'Server connection issue. Please check your network connection.';
                errorBanner.classList.remove('hidden');
            }
        }
        
        // Initialize placeholders on load
        setRole('admin');
    </script>

</body>
</html>
